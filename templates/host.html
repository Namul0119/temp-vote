{% extends "base.html" %}

{% block title %}
방장 대기 화면
{% endblock %}

{% block head %}
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/host.css') }}">
{% endblock %}

{% block content %}

<h1>방이 생성되었습니다</h1>

<p class="status">
    {{ current }}/{{ target }}명 참여 완료
</p>

<p class="desc">
    아래 링크를 참여자들에게 공유하세요.
</p>

<input id="roomLink"
       value="{{ room_url }}">

<br><br>

<p class="desc">QR로 참여하기</p>

<img class="qr-image"
     src="data:image/png;base64,{{ qr_image }}">

<br><br>

<button class="secondary-btn"
        id="copyLinkBtn">

    링크 복사
</button>

<br><br>

<a href="{{ url_for('result', code=code) }}">
    <button class="primary-btn">
        결과 확인하기
    </button>
</a>

<script src="{{ url_for('static', filename='js/host.js') }}"></script>

{% endblock %}
