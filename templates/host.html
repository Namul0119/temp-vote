{% extends "base.html" %}

{% block title %}
방장 대기 화면
{% endblock %}

{% block head %}
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/host.css') }}">
{% endblock %}

{% block content %}

<div class="center-page">

    <div class="ui-card">

        <h1 class="ui-title">
            방이 생성되었습니다
        </h1>

        <p class="ui-big-text ui-highlight">
            {{ current }}/{{ target }}명 참여 완료
        </p>

        <p class="ui-subtitle">
            아래 링크를 참여자들에게 공유하세요.
        </p>

        <input id="roomLink"
               class="mt-20"
               value="{{ room_url }}">

        <p class="ui-subtitle mt-30">
            QR로 참여하기
        </p>

        <img class="qr-image"
             src="data:image/png;base64,{{ qr_image }}">

        <div class="mt-30">

            <button class="secondary-btn"
                    id="copyLinkBtn">
                링크 복사
            </button>

        </div>

        <div class="mt-20">

            <a href="{{ url_for('result', code=code) }}">
                <button class="primary-btn">
                    결과 확인하기
                </button>
            </a>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/host.js') }}"></script>

{% endblock %}
