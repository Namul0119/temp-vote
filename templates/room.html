<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>입력 화면</title>

<style>
body {
    background:#101114;
    color:white;
    font-family:Arial;
    text-align:center;
    padding-top:60px;
}

.container {
    width: min(420px, 92vw);
    margin:0 auto;
}

h1 {
    margin-bottom:10px;
}

.subtitle {
    color:#aaa;
    margin-bottom:25px;
}

select, input {
    width:100%;
    padding:12px;
    margin-bottom:15px;
    background:#292b31;
    border:none;
    color:white;
    border-radius:6px;
}

button {
    width:100%;
    padding:14px;
    background:#2f6df6;
    border:none;
    color:white;
    font-size:16px;
    border-radius:6px;
    cursor:pointer;
}

button {
    transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(47, 109, 246, 0.35);
    background: #3f7cff;
}

button:active {
    transform: translateY(0);
}

.status {
    margin-bottom:20px;
    font-size:18px;
    color:#62ffd5;
}
</style>
</head>

<body>

<div class="container">

    <h1>정보 입력</h1>
    <div class="subtitle">현재 상태를 입력해주세요</div>

    <div class="status">
        {{ current }}/{{ target }}명 참여 완료
    </div>

    <form method="post">
        <input type="text" name="name" placeholder="이름 또는 닉네임" required>

        <select name="sex">
            <option value="male">남성</option>
            <option value="female">여성</option>
        </select>

        <select name="age_group">
            <option value="teen">청소년</option>
            <option value="adult">성인</option>
            <option value="senior">노년층</option>
        </select>

        <input type="number" name="temp" min="18" max="30" placeholder="원하는 온도 (18~30)" required>

        <select name="clothes">
            <option value="thin">얇음</option>
            <option value="normal">보통</option>
            <option value="thick">두꺼움</option>
        </select>

        <select name="feels">
            <option value="cold">춥다</option>
            <option value="ok">괜찮다</option>
            <option value="hot">덥다</option>
        </select>

        <select name="activity">
            <option value="still">가만히 있음</option>
            <option value="move">조금 움직임</option>
        </select>

        <select name="position">
            <option value="center">중앙</option>
            <option value="window">창가</option>
            <option value="ac">에어컨 근처</option>
        </select>

        <button type="submit">입력 완료</button>

    </form>

</div>

</body>
</html>
